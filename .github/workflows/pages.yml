name: Build, verify and deploy GPU resale website
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', 'docs/**', 'data/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build resale website from the read-only testing sheet
        run: |
          set -euo pipefail
          python3 tools/sync_fleet.py
          python3 tools/build_resale.py
          python3 tools/audit_public_furmark.py
          if ! command -v pandoc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y pandoc
          fi
          python3 tools/build_site.py
      - name: Validate generated resale data, cards and site
        run: node tools/test_site.mjs
      - name: Browser smoke tests (desktop and mobile)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.57.0
          node tools/browser_smoke.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Wait for Pages artifact propagation
        run: sleep 25
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify live website and card listing templates
        run: |
          set -euo pipefail
          site_url="https://parris-tech-services.github.io/furmark-history/"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 "${site_url}" -o /tmp/furmark-live.html && grep -q 'Compare this card' /tmp/furmark-live.html; then
              echo "Production homepage includes the fleet explorer"
              break
            fi
            if [ "$attempt" = 18 ]; then echo "Production homepage not deployed"; exit 1; fi
            sleep 5
          done
          last_card=$(python3 -c "import json; print(max(c['card'] for c in json.load(open('site/data/batch.json'))['cards']))")
          for asset in assets/app.js assets/home.js data/batch.json data/resale.json resale.html sale.html cards/card-18.html "cards/card-$(printf '%02d' "$last_card").html"; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "${site_url}${asset}" --output /dev/null
            echo "Live OK: $asset"
          done
          # Verify the exact new 89-card research document, not just the homepage.
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 "${site_url}read/gtx1070-89-card-research.html" -o /tmp/gtx1070-research.html && grep -q '89 GTX 1070s: history, unlocks, AI and economics' /tmp/gtx1070-research.html; then
              echo "Verified live: sourced 89-card GTX 1070 research page"
              break
            fi
            if [ "$attempt" = 18 ]; then echo "New research page was not published correctly"; exit 1; fi
            sleep 5
          done
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "${site_url}read/gtx1070-exact-schematics-boardviews.html" -o /tmp/gtx-schematics.html
          grep -q 'GP104H8-D50 Rev A' /tmp/gtx-schematics.html
          grep -q 'GV-N1070WF2OC-8GD Rev. 2.0' /tmp/gtx-schematics.html
          echo "Verified live: exact-model schematic and boardview source index"
          echo "Verified deployed site for card #$last_card"
          for page in gtx1070-reuse-findings gtx1070-reuse-research-prompt; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${site_url}read/${page}.html" -o "/tmp/${page}.html"
            grep -q 'Immich' "/tmp/${page}.html"
            echo "Verified live: $page"
          done
