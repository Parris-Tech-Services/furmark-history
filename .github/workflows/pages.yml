name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/test_site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published site and dataset
        run: node tools/test_site.mjs
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Allow GitHub Pages artifact metadata to become available after upload.
      # Rerun as a fresh workflow run, not a failed-job rerun, to avoid duplicate artifacts.
      - name: Wait for Pages artifact propagation
        run: sleep 25
      - id: deployment
        uses: actions/deploy-pages@v4
